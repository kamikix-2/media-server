server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /cv {
        return 301 /cv/;
    }

    location ^~ /cv/ {
        set $cv_upstream cv-manager-bcn:8084;
        proxy_pass http://$cv_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /portatiles {
        return 301 /portatiles/;
    }

    location ^~ /portatiles/ {
        set $portatiles_upstream portatiles-manager:3000;
        proxy_pass http://$portatiles_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        set $portatiles_upstream portatiles-manager:3000;
        proxy_pass http://$portatiles_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}